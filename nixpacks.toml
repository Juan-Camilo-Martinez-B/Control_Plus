# ============================================
# Configuración Nixpacks para Railway
# ============================================
# Este archivo le indica a Railway cómo construir
# y ejecutar la aplicación Spring Boot
# IMPORTANTE: Root Directory debe estar configurado como "Backend" en Railway

[phases.setup]
# Paquetes necesarios para compilar y ejecutar
nixPkgs = ['maven', 'jdk17']

[phases.build]
# Comando para compilar el proyecto
# Como Root Directory = Backend, no necesitamos "cd Backend"
cmds = ['mvn clean package -DskipTests']

[start]
# Comando para iniciar la aplicación
# $PORT es la variable que Railway asigna automáticamente
# Como Root Directory = Backend, la ruta es relativa
cmd = 'java -Dserver.port=$PORT -jar target/*.jar'

