# ============================================
# Configuración de Producción (Railway)
# ============================================
# Este archivo se usa automáticamente cuando la variable 
# SPRING_PROFILES_ACTIVE=production está configurada

spring.application.name=backend

# Puerto: Railway proporciona la variable $PORT automáticamente
server.port=${PORT:8080}
spring.mvc.pathmatch.matching-strategy=path_pattern_parser

# ============================================
# Configuración de Correo SMTP
# ============================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.from=${MAIL_FROM}

# ============================================
# Configuración MongoDB Atlas
# ============================================
spring.data.mongodb.uri=${MONGODB_URI}

# ============================================
# Configuración de archivos
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

