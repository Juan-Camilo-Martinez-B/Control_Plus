# ============================================
# Configuración de Producción (Railway)
# ============================================
# Este archivo se usa automáticamente cuando la variable 
# SPRING_PROFILES_ACTIVE=production está configurada

spring.application.name=backend

# Puerto: Railway proporciona la variable $PORT automáticamente
server.port=${PORT:8080}
spring.mvc.pathmatch.matching-strategy=path_pattern_parser

# URL base de la aplicación (para links en correos)
app.base.url=${APP_BASE_URL:https://controlplus-production.up.railway.app}

# ============================================
# Configuración de Correo - SendGrid
# ============================================
# SendGrid API Key (usa HTTP, no bloqueado por Railway)
# IMPORTANTE: Configurar SENDGRID_API_KEY como variable de entorno en Railway
sendgrid.api.key=${SENDGRID_API_KEY}
spring.mail.from=${MAIL_FROM:martinez.b.juan.camilo@gmail.com}

# ============================================
# Configuración MongoDB Atlas
# ============================================
# URI con configuración SSL optimizada para Railway
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://juanmartinezbed:thzc7manda@controlplus.wr9wpcb.mongodb.net/ControlPlus?retryWrites=true&w=majority&appName=ControlPluss&ssl=true&tlsAllowInvalidHostnames=true}

# ============================================
# Configuración de archivos
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

